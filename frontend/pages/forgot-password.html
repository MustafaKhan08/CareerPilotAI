<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerPilotAI</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        accent: '#06B6D4',
                        dark: '#0F172A',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-dark text-slate-50 antialiased">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow auth-container" aria-label="Forgot Password Section">
        <section class="glass-panel auth-card relative overflow-hidden">
            <!-- Background Decorative Blobs -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary opacity-20 rounded-full blur-2xl z-0" aria-hidden="true"></div>

            <div class="relative z-10">
                <header class="text-center mb-8">
                    <div class="flex justify-center mb-4">
                        <div class="w-14 h-14 bg-primary bg-opacity-20 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-key text-2xl text-primary" aria-hidden="true"></i>
                        </div>
                    </div>
                    <h1 class="text-3xl font-bold mb-2">Forgot Password?</h1>
                    <p class="text-gray-400">Enter your email and we'll send you a reset link.</p>
                </header>

                <!-- Success state (hidden initially) -->
                <div id="success-state" class="hidden text-center py-4">
                    <div class="flex justify-center mb-4">
                        <div class="w-14 h-14 bg-green-500 bg-opacity-20 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-envelope-circle-check text-2xl text-green-400" aria-hidden="true"></i>
                        </div>
                    </div>
                    <p class="text-gray-300 mb-6">If that email is registered, a password-reset link has been sent. Check your inbox.</p>
                    <a href="login.html" class="btn btn-primary auth-btn hover-scale text-center block">Back to Sign In</a>
                </div>

                <!-- Form state -->
                <div id="form-state">
                    <form id="forgot-password-form" novalidate aria-label="Forgot Password Form">
                        <div class="auth-form-group mb-6">
                            <label for="email" class="auth-label">Email Address</label>
                            <div class="relative flex items-center">
                                <i class="fa-solid fa-envelope absolute left-4 text-gray-500" aria-hidden="true"></i>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="auth-input pl-10 pr-4 w-full"
                                    placeholder="you@example.com"
                                    autocomplete="email"
                                    aria-required="true"
                                    required>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-primary auth-btn hover-scale">
                            Send Reset Link
                        </button>
                    </form>

                    <footer class="text-center mt-6">
                        <p class="text-gray-400 text-sm">
                            Remembered it? <a href="login.html" class="auth-link font-medium">Sign in</a>
                        </p>
                    </footer>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            utils.loadComponent('navbar-container', '../components/navbar.html');
            utils.loadComponent('footer-container', '../components/footer.html');

            const form = document.getElementById('forgot-password-form');
            const submitBtn = document.getElementById('submit-btn');
            const formState = document.getElementById('form-state');
            const successState = document.getElementById('success-state');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();

                if (!email) {
                    utils.showNotification('Please enter your email address.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

                try {
                    await api.forgotPassword(email);
                    formState.classList.add('hidden');
                    successState.classList.remove('hidden');
                } catch (error) {
                    utils.showNotification(error.message || 'Something went wrong. Please try again.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Send Reset Link';
                }
            });
        });
    </script>
</body>
</html>
