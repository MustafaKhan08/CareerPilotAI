<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerPilotAI</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        accent: '#06B6D4',
                        dark: '#0F172A',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-dark text-slate-50 antialiased">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow auth-container" aria-label="Registration Section">
        <section class="glass-panel auth-card relative overflow-hidden">
            <!-- Background Decorative Blobs -->
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-secondary opacity-20 rounded-full blur-2xl z-0" aria-hidden="true"></div>
            
            <div class="relative z-10">
                <header class="text-center mb-8">
                    <h1 class="text-3xl font-bold mb-2">Create Account</h1>
                    <p class="text-gray-400">Join CareerPilotAI to elevate your career.</p>
                </header>

                <form id="register-form" novalidate aria-label="Registration Form">
                    <div class="auth-form-group">
                        <label for="name" class="auth-label">Full Name</label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-user absolute left-4 text-gray-500" aria-hidden="true"></i>
                            <input 
                                type="text" 
                                id="name" 
                                name="name"
                                class="auth-input pl-10 pr-4 w-full" 
                                placeholder="John Doe" 
                                autocomplete="name"
                                aria-required="true"
                                required>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label for="email" class="auth-label">Email Address</label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-envelope absolute left-4 text-gray-500" aria-hidden="true"></i>
                            <input 
                                type="email" 
                                id="email" 
                                name="email"
                                class="auth-input pl-10 pr-4 w-full" 
                                placeholder="you@example.com" 
                                autocomplete="email"
                                aria-required="true"
                                required>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label for="password" class="auth-label">Password</label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-lock absolute left-4 text-gray-500" aria-hidden="true"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password"
                                class="auth-input pl-10 pr-10 w-full" 
                                placeholder="••••••••" 
                                autocomplete="new-password"
                                minlength="8"
                                aria-required="true"
                                aria-describedby="password-hint"
                                required>
                            <i class="fa-solid fa-eye absolute right-4 password-toggle" aria-label="Toggle password visibility" role="button" tabindex="0"></i>
                        </div>
                        <span id="password-hint" class="text-xs text-gray-500 mt-1 block">Minimum 8 characters.</span>
                    </div>

                    <div class="auth-form-group mb-6">
                        <label for="confirm-password" class="auth-label">Confirm Password</label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-lock absolute left-4 text-gray-500" aria-hidden="true"></i>
                            <input 
                                type="password" 
                                id="confirm-password" 
                                name="confirm-password"
                                class="auth-input pl-10 pr-10 w-full" 
                                placeholder="••••••••" 
                                autocomplete="new-password"
                                aria-required="true"
                                required>
                            <i class="fa-solid fa-eye absolute right-4 password-toggle" aria-label="Toggle password visibility" role="button" tabindex="0"></i>
                        </div>
                    </div>

                    <button type="submit" id="register-btn" class="btn btn-primary auth-btn hover-scale">
                        Create Account
                    </button>
                </form>

                <footer class="text-center mt-6">
                    <p class="text-gray-400 text-sm">
                        Already have an account? <a href="login.html" class="auth-link font-medium">Sign in</a>
                    </p>
                </footer>
            </div>
        </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            utils.loadComponent('navbar-container', '../components/navbar.html');
            utils.loadComponent('footer-container', '../components/footer.html');
        });
    </script>
</body>
</html>
