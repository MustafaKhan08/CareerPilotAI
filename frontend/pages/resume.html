<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Management - CareerPilotAI</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        accent: '#06B6D4',
                        dark: '#0F172A',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/resume.css">
</head>
<body class="bg-dark text-slate-50 antialiased dashboard-layout">

    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Top Navbar Container -->
        <div id="navbar-container"></div>

        <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
            <!-- Page Header -->
            <header class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-white mb-2">Resume Management</h1>
                    <p class="text-gray-400">Upload, organize, and analyze your career documents.</p>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left Column: Upload Section -->
                <div class="lg:col-span-4">
                    <section class="glass-panel p-6 sticky top-6" aria-label="Upload Resume">
                        <h2 class="text-lg font-semibold mb-4">Upload Resume</h2>
                        
                        <div class="upload-zone" id="upload-zone">
                            <i id="upload-icon" class="fa-solid fa-cloud-arrow-up text-primary text-4xl mb-4" aria-hidden="true"></i>
                            <p id="upload-label" class="text-gray-300">
                                <span class="text-primary font-medium">Click to upload</span> or drag and drop
                                <br>
                                <span class="text-sm text-gray-500 mt-2 inline-block">PDF, DOCX up to 5MB</span>
                            </p>
                            <!-- Hidden File Input -->
                            <input type="file" id="resume-upload-input" accept=".pdf,.doc,.docx" aria-label="File Upload">
                        </div>
                    </section>
                </div>

                <!-- Right Column: Resume List -->
                <div class="lg:col-span-8">
                    <section class="glass-panel p-6" aria-label="Your Resumes">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-lg font-semibold">Your Resumes</h2>
                        </div>
                        
                        <div id="resume-list-container" class="border border-gray-800 rounded-lg overflow-hidden bg-gray-900/30">
                            <!-- Populated by JavaScript -->
                            <div class="flex justify-center py-10">
                                <i class="fa-solid fa-spinner fa-spin text-primary text-3xl" aria-hidden="true"></i>
                            </div>
                        </div>
                    </section>
                </div>

            </div>
        </main>
    </div>

    <!-- Modals -->
    
    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <div class="modal-content relative">
            <button type="button" class="modal-close" aria-label="Close modal">
                <i class="fa-solid fa-times" aria-hidden="true"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-2xl" aria-hidden="true"></i>
                </div>
                <h3 id="delete-modal-title" class="text-xl font-bold text-white mb-2">Delete Resume</h3>
                <p class="text-gray-400">Are you sure you want to delete this resume? This action cannot be undone.</p>
            </div>
            <div class="flex gap-4 justify-center">
                <button type="button" class="btn modal-cancel bg-gray-700 hover:bg-gray-600 text-white px-6 focus-visible:ring-2 focus-visible:ring-gray-400">Cancel</button>
                <button type="button" id="confirm-delete-btn" class="btn bg-red-500 hover:bg-red-600 text-white px-6 focus-visible:ring-2 focus-visible:ring-red-400">Delete</button>
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div id="details-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="details-modal-title">
        <div class="modal-content relative">
            <button type="button" class="modal-close" aria-label="Close modal">
                <i class="fa-solid fa-times" aria-hidden="true"></i>
            </button>
            <h3 id="details-modal-title" class="text-xl font-bold text-white mb-4">Resume Details</h3>
            <div id="details-modal-body">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/resume.js"></script>
</body>
</html>
