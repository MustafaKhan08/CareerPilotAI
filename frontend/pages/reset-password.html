<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CareerPilotAI</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        accent: '#06B6D4',
                        dark: '#0F172A',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-dark text-slate-50 antialiased">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow auth-container" aria-label="Reset Password Section">
        <section class="glass-panel auth-card relative overflow-hidden">
            <!-- Background Decorative Blobs -->
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-secondary opacity-20 rounded-full blur-2xl z-0" aria-hidden="true"></div>

            <div class="relative z-10">
                <!-- Invalid token state -->
                <div id="invalid-state" class="hidden text-center py-4">
                    <div class="flex justify-center mb-4">
                        <div class="w-14 h-14 bg-red-500 bg-opacity-20 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-triangle-exclamation text-2xl text-red-400" aria-hidden="true"></i>
                        </div>
                    </div>
                    <h1 class="text-2xl font-bold mb-2">Link Expired</h1>
                    <p class="text-gray-400 mb-6">This reset link is invalid or has already been used. Please request a new one.</p>
                    <a href="forgot-password.html" class="btn btn-primary auth-btn hover-scale text-center block">Request New Link</a>
                </div>

                <!-- Success state -->
                <div id="success-state" class="hidden text-center py-4">
                    <div class="flex justify-center mb-4">
                        <div class="w-14 h-14 bg-green-500 bg-opacity-20 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-circle-check text-2xl text-green-400" aria-hidden="true"></i>
                        </div>
                    </div>
                    <h1 class="text-2xl font-bold mb-2">Password Reset!</h1>
                    <p class="text-gray-300 mb-6">Your password has been updated successfully.</p>
                    <a href="login.html" class="btn btn-primary auth-btn hover-scale text-center block">Sign In</a>
                </div>

                <!-- Form state -->
                <div id="form-state">
                    <header class="text-center mb-8">
                        <div class="flex justify-center mb-4">
                            <div class="w-14 h-14 bg-primary bg-opacity-20 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-lock-open text-2xl text-primary" aria-hidden="true"></i>
                            </div>
                        </div>
                        <h1 class="text-3xl font-bold mb-2">Set New Password</h1>
                        <p class="text-gray-400">Choose a strong password for your account.</p>
                    </header>

                    <form id="reset-password-form" novalidate aria-label="Reset Password Form">
                        <div class="auth-form-group">
                            <label for="password" class="auth-label">New Password</label>
                            <div class="relative flex items-center">
                                <i class="fa-solid fa-lock absolute left-4 text-gray-500" aria-hidden="true"></i>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="auth-input pl-10 pr-10 w-full"
                                    placeholder="••••••••"
                                    autocomplete="new-password"
                                    minlength="8"
                                    aria-required="true"
                                    aria-describedby="password-hint"
                                    required>
                                <i class="fa-solid fa-eye absolute right-4 password-toggle" aria-label="Toggle password visibility" role="button" tabindex="0"></i>
                            </div>
                            <span id="password-hint" class="text-xs text-gray-500 mt-1 block">Minimum 8 characters.</span>
                        </div>

                        <div class="auth-form-group mb-6">
                            <label for="confirm-password" class="auth-label">Confirm New Password</label>
                            <div class="relative flex items-center">
                                <i class="fa-solid fa-lock absolute left-4 text-gray-500" aria-hidden="true"></i>
                                <input
                                    type="password"
                                    id="confirm-password"
                                    name="confirm-password"
                                    class="auth-input pl-10 pr-10 w-full"
                                    placeholder="••••••••"
                                    autocomplete="new-password"
                                    aria-required="true"
                                    required>
                                <i class="fa-solid fa-eye absolute right-4 password-toggle" aria-label="Toggle password visibility" role="button" tabindex="0"></i>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-primary auth-btn hover-scale">
                            Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            utils.loadComponent('navbar-container', '../components/navbar.html');
            utils.loadComponent('footer-container', '../components/footer.html');

            // Extract token from URL
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            const formState = document.getElementById('form-state');
            const invalidState = document.getElementById('invalid-state');
            const successState = document.getElementById('success-state');

            if (!token) {
                formState.classList.add('hidden');
                invalidState.classList.remove('hidden');
                return;
            }

            // Initialise password toggles from auth.js
            auth.initPasswordToggles();

            const form = document.getElementById('reset-password-form');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (password.length < 8) {
                    utils.showNotification('Password must be at least 8 characters.', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    utils.showNotification('Passwords do not match.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

                try {
                    await api.resetPassword(token, password);
                    formState.classList.add('hidden');
                    successState.classList.remove('hidden');
                } catch (error) {
                    if (error.message && error.message.toLowerCase().includes('invalid')) {
                        formState.classList.add('hidden');
                        invalidState.classList.remove('hidden');
                    } else {
                        utils.showNotification(error.message || 'Reset failed. Please try again.', 'error');
                    }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Reset Password';
                }
            });
        });
    </script>
</body>
</html>
